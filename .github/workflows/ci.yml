name: FoodBridge CI/CD Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v3

    - name: Setup Node.js Environment
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Install & Validate Backend Build
      run: |
        cd backend
        npm ci || npm install
        
    - name: Install & Compile Frontend Production Assets
      run: |
        cd frontend
        npm ci || npm install
        npm run build
